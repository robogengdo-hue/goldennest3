<!-- Core Script -->
    <script>
        const SUPABASE_URL = 'https://oemydtxwalfjmluzykmr.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_gK1skiPXPysYi9wOiFjQzg_0vYEmg3I';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let currentProfile = null;
        let allVideos = [];
        let savedVideoIds = new Set();
        let currentCategory = 'All';
        let searchQuery = '';
        let isSignUpMode = false;

        window.initTheme = function() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                let icon = document.getElementById('themeIcon');
                if (icon) icon.innerText = '☀️';
            } else {
                document.documentElement.classList.remove('dark');
                let icon = document.getElementById('themeIcon');
                if (icon) icon.innerText = '🌙';
            }
        };

        window.toggleDarkMode = function() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
                let icon = document.getElementById('themeIcon');
                if (icon) icon.innerText = '🌙';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
                let icon = document.getElementById('themeIcon');
                if (icon) icon.innerText = '☀️';
            }
        };

        async function initApp() {
            window.initTheme();
            try {
                let { data: { session } } = await _supabase.auth.getSession();
                if (session && session.user) {
                    currentUser = session.user;
                    await fetchProfile(currentUser.id);
                    await fetchSavedVideosList();
                    updateAuthUI();
                    fetchVideosFromCloud();
                } else {
                    openAuthModal('login');
                    let loadingEl = document.getElementById('loadingState');
                    if (loadingEl) loadingEl.innerHTML = "Please sign in to view GoldenNest.";
                }
            } catch (err) {
                console.error("Auth session error:", err);
                openAuthModal('login');
            }
        }

        async function fetchProfile(userId) {
            let { data } = await _supabase.from('profiles').select('*').eq('id', userId).single();
            currentProfile = data;
        }

        async function fetchSavedVideosList() {
            if (!currentUser) return;
            let { data } = await _supabase.from('saved_videos').select('video_id').eq('user_id', currentUser.id);
            savedVideoIds = new Set(data ? data.map(s => s.video_id) : []);
        }

        function updateAuthUI() {
            let authNavArea = document.getElementById('authNavArea');
            if (currentUser && currentProfile && authNavArea) {
                authNavArea.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span onclick="viewProfile('${currentProfile.username}')" class="text-sm font-semibold text-gold-600 cursor-pointer hover:underline">@${currentProfile.username}</span>
                        <button onclick="handleLogout()" class="text-xs bg-gray-100 dark:bg-gray-800 px-3 py-1.5 rounded-full">Sign Out</button>
                    </div>
                `;
            }
        }

        async function fetchVideosFromCloud() {
            try {
                let { data, error } = await _supabase.from('videos').select('*, profiles(username, avatar_url)').order('created_at', { ascending: false });
                let loadingEl = document.getElementById('loadingState');
                if (loadingEl) loadingEl.style.display = 'none';
                if (error) { console.error(error); return; }
                allVideos = data || [];
                renderFeed();
            } catch (err) { console.error(err); }
        }

        function renderFeed(videosToRender = null) {
            let feed = document.getElementById('videoFeed');
            if (!feed) return;
            feed.innerHTML = '';
            let list = videosToRender || allVideos;

            if (!videosToRender) {
                list = allVideos.filter(v => {
                    let creatorName = v.profiles ? v.profiles.username : v.creator;
                    let matchesCategory = currentCategory === 'All' || v.category === currentCategory || creatorName === currentCategory || (currentCategory === 'Trending' && (v.likes || 0) > 0);
                    let query = searchQuery.toLowerCase();
                    let matchesSearch = v.title.toLowerCase().includes(query) || creatorName.toLowerCase().includes(query);
                    return matchesCategory && matchesSearch;
                });
                if (currentCategory === 'Trending') list.sort((a, b) => (b.likes || 0) - (a.likes || 0));
            }

            if (list.length === 0) {
                feed.innerHTML = `<div class="col-span-2 text-center py-12 text-gray-400">No videos found.</div>`;
                return;
            }

            list.forEach(v => {
                let creatorName = v.profiles ? v.profiles.username : v.creator;
                let isOwner = currentUser && v.user_id === currentUser.id;
                let isSaved = savedVideoIds.has(v.id);

                let card = document.createElement('div');
                card.className = "bg-white dark:bg-gray-900 border rounded-2xl overflow-hidden shadow-sm flex flex-col";
                card.innerHTML = `
                    <div class="aspect-video bg-black"><video src="${v.url}" controls class="w-full h-full object-cover"></video></div>
                    <div class="p-4 space-y-3">
                        <h3 class="font-semibold">${v.title}</h3>
                        <p onclick="viewProfile('${creatorName}')" class="text-sm text-gold-600 cursor-pointer">@${creatorName}</p>
                        <div class="flex items-center justify-between text-xs pt-2 border-t">
                            <button onclick="handleLike(${v.id}, ${v.likes || 0}, '${v.user_id}')" class="px-2 py-1 border rounded">❤️ ${v.likes || 0}</button>
                            <button onclick="toggleSave(${v.id})" class="px-2 py-1 border rounded">${isSaved ? 'Saved' : 'Save'}</button>
                            ${isOwner ? `<button onclick="deleteVideo(${v.id})" class="text-red-500">Delete</button>` : ''}
                        </div>
                    </div>
                `;
                feed.appendChild(card);
            });
        }

        function showReelsFeed() {
            let container = document.getElementById('dynamicContentArea');
            if (!container) return;
            container.innerHTML = `<h2 class="text-xl font-bold mb-4">⚡ Reels</h2><div class="flex flex-col items-center space-y-8" id="reelsContainer"></div>`;
            let reelsContainer = document.getElementById('reelsContainer');
            let reelsList = allVideos.filter(v => v.format === 'vertical');
            if (reelsList.length === 0) reelsList = allVideos;

            reelsList.forEach(v => {
                let card = document.createElement('div');
                card.className = "relative bg-black rounded-3xl overflow-hidden shadow-2xl w-full max-w-sm aspect-[9/16] flex items-center justify-center border";
                card.innerHTML = `<video src="${v.url}" controls loop class="w-full h-full object-cover"></video>`;
                reelsContainer.appendChild(card);
            });
        }

        function filterByCategory(cat) { currentCategory = cat; renderFeed(); }
        function searchVideos() { searchQuery = document.getElementById('searchInput').value; renderFeed(); }
        function goHome() { document.getElementById('feedHeader').style.display = 'flex'; document.getElementById('dynamicContentArea').innerHTML = `<div id="videoFeed" class="grid grid-cols-1 sm:grid-cols-2 gap-6"></div>`; fetchVideosFromCloud(); }
        
        function openAuthModal(mode) {
            isSignUpMode = (mode === 'signup');
            document.getElementById('authTitle').innerText = isSignUpMode ? "Join GoldenNest" : "Sign In";
            document.getElementById('authSubmitBtn').innerText = isSignUpMode ? "Create Account" : "Sign In";
            document.getElementById('usernameFieldGroup').classList.toggle('hidden', !isSignUpMode);
            document.getElementById('authModal').classList.remove('hidden');
        }
        function closeAuthModal() { document.getElementById('authModal').classList.add('hidden'); }
        function toggleAuthMode() { openAuthModal(isSignUpMode ? 'login' : 'signup'); }

        function openUploadModal() { document.getElementById('uploadModal').classList.remove('hidden'); }
        function closeUploadModal() { document.getElementById('uploadModal').classList.add('hidden'); }

        async function handleAuthSubmit(event) {
            event.preventDefault();
            let email = document.getElementById('authEmail').value;
            let password = document.getElementById('authPassword').value;
            if (isSignUpMode) {
                let username = document.getElementById('authUsername').value;
                let { data, error } = await _supabase.auth.signUp({ email, password });
                if (error) { alert(error.message); return; }
                if (data.user) await _supabase.from('profiles').insert([{ id: data.user.id, username: username, bio: "Creator" }]);
            } else {
                let { error } = await _supabase.auth.signInWithPassword({ email, password });
                if (error) { alert(error.message); return; }
            }
            closeAuthModal();
            window.location.reload();
        }

        async function handleLogout() { await _supabase.auth.signOut(); window.location.reload(); }

        async function handleCloudBucketUpload(event) {
            event.preventDefault();
            let file = document.getElementById('videoFile').files[0];
            let fileName = `${Date.now()}_${file.name}`;
            let { error } = await _supabase.storage.from('videos').upload(fileName, file);
            if (error) { alert(error.message); return; }
            let { data: publicUrlData } = _supabase.storage.from('videos').getPublicUrl(fileName);
            await _supabase.from('videos').insert([{
                title: document.getElementById('videoTitle').value,
                description: document.getElementById('videoDescription').value,
                creator: currentProfile.username,
                user_id: currentUser.id,
                category: document.getElementById('videoCategory').value,
                format: document.getElementById('videoFormat').value,
                url: publicUrlData.publicUrl,
                likes: 0
            }]);
            closeUploadModal();
            fetchVideosFromCloud();
        }

        async function handleLike(id, currentLikes, ownerUserId) {
            await _supabase.from('videos').update({ likes: currentLikes + 1 }).eq('id', id);
            fetchVideosFromCloud();
        }

        async function toggleSave(videoId) {
            if (!currentUser) return;
            if (savedVideoIds.has(videoId)) {
                await _supabase.from('saved_videos').delete().eq('user_id', currentUser.id).eq('video_id', videoId);
                savedVideoIds.delete(videoId);
            } else {
                await _supabase.from('saved_videos').insert([{ user_id: currentUser.id, video_id: videoId }]);
                savedVideoIds.add(videoId);
            }
            renderFeed();
        }

        async function deleteVideo(id) {
            if (!confirm("Delete video?")) return;
            await _supabase.from('videos').delete().eq('id', id);
            fetchVideosFromCloud();
        }

        async function showNotifications() {
            let container = document.getElementById('dynamicContentArea');
            container.innerHTML = `<h2 class="text-xl font-bold mb-4">🔔 Notifications</h2><p class="text-gray-400">Activity stream active.</p>`;
        }

        async function viewProfile(username) {
            let container = document.getElementById('dynamicContentArea');
            let { data: profileData } = await _supabase.from('profiles').select('*').eq('username', username).single();
            container.innerHTML = `<h2 class="text-xl font-bold mb-2">@${username}</h2><p class="text-sm text-gray-500">${profileData ? (profileData.bio || 'No bio') : ''}</p>`;
        }

        window.onload = initApp;
    </script>
