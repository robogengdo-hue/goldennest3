<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoldenNest - Creator Media Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: { 500: '#D4AF37', 600: '#AA8C2C' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex flex-col">

    <!-- Top Navigation Bar -->
    <header class="sticky top-0 z-50 bg-white border-b border-gray-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="goHome()">
                <div class="w-10 h-10 rounded-xl bg-gold-500 flex items-center justify-center text-white font-bold text-xl shadow-md">G</div>
                <span class="text-xl font-bold tracking-tight text-gray-900">Golden<span class="text-gold-600">Nest</span></span>
            </div>

            <!-- Search Bar -->
            <div class="hidden md:flex flex-1 max-w-md mx-8">
                <div class="relative w-full">
                    <input type="text" id="searchInput" oninput="searchVideos()" placeholder="Search videos or creators..." class="w-full bg-gray-100 border border-gray-200 rounded-full py-2 pl-4 pr-10 text-sm focus:outline-none focus:border-gold-500 focus:bg-white transition-all">
                    <span class="absolute right-3 top-2.5 text-gray-400">🔍</span>
                </div>
            </div>

            <div class="flex items-center space-x-4">
                <button onclick="openUploadModal()" id="uploadNavBtn" class="hidden bg-gold-500 hover:bg-gold-600 text-white px-4 py-2 rounded-full text-sm font-semibold shadow-sm transition-all">+ Create</button>
                <div id="authNavArea">
                    <button onclick="openAuthModal('login')" class="text-sm font-semibold text-gray-700 hover:text-gold-600 px-3 py-2">Sign In</button>
                    <button onclick="openAuthModal('signup')" class="bg-gold-500 hover:bg-gold-600 text-white px-4 py-2 rounded-full text-sm font-semibold shadow-sm transition-all">Sign Up</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Layout -->
    <main class="flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-1 lg:grid-cols-4 gap-8">
        <aside class="hidden lg:block lg:col-span-1 space-y-2">
            <a href="#" onclick="goHome()" class="flex items-center space-x-3 px-4 py-3 rounded-xl bg-gold-50 text-gold-600 font-semibold"><span>🏠</span> <span>Home Feed</span></a>
            <a href="#" onclick="filterByCategory('Cinematic')" class="flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-gray-100 text-gray-600 font-medium"><span>🎬</span> <span>Cinematic</span></a>
            <a href="#" onclick="filterByCategory('Technology')" class="flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-gray-100 text-gray-600 font-medium"><span>💻</span> <span>Technology</span></a>
            <a href="#" onclick="filterByCategory('Vlogs')" class="flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-gray-100 text-gray-600 font-medium"><span>🎥</span> <span>Vlogs</span></a>
        </aside>

        <!-- Media Feed / Profile View -->
        <section class="col-span-1 lg:col-span-3 space-y-6">
            <div id="feedHeader" class="flex items-center space-x-2 overflow-x-auto pb-2">
                <button onclick="filterByCategory('All')" class="category-btn bg-gray-900 text-white px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap">All</button>
                <button onclick="filterByCategory('Cinematic')" class="category-btn bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap transition-all">Cinematic</button>
                <button onclick="filterByCategory('Technology')" class="category-btn bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap transition-all">Technology</button>
                <button onclick="filterByCategory('Vlogs')" class="category-btn bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap transition-all">Vlogs</button>
            </div>

            <div id="dynamicContentArea" class="space-y-6">
                <div id="loadingState" class="text-center py-12 text-gray-400">Loading GoldenNest cloud platform...</div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6" id="videoFeed"></div>
            </div>
        </section>
    </main>

    <!-- Auth Modal (Sign In / Sign Up) -->
    <div id="authModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                <h3 id="authTitle" class="text-lg font-bold text-gray-900">Sign In to GoldenNest</h3>
                <button onclick="closeAuthModal()" class="text-gray-400 hover:text-gray-600 font-bold text-lg">&times;</button>
            </div>
            <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-3">
                <div id="usernameFieldGroup" class="hidden">
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Username / Handle</label>
                    <input type="text" id="authUsername" placeholder="e.g. mr_psycho" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-gold-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Email</label>
                    <input type="email" id="authEmail" required placeholder="name@example.com" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-gold-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Password</label>
                    <input type="password" id="authPassword" required placeholder="••••••••" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-gold-500">
                </div>
                <div class="pt-2 flex flex-col space-y-2">
                    <button type="submit" id="authSubmitBtn" class="w-full bg-gold-500 hover:bg-gold-600 text-white py-2.5 rounded-xl text-sm font-semibold shadow-sm">Sign In</button>
                    <button type="button" onclick="toggleAuthMode()" id="authToggleBtn" class="text-xs text-gold-600 hover:underline text-center">Don't have an account? Sign Up</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Upload Modal -->
    <div id="uploadModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                <h3 class="text-lg font-bold text-gray-900">Upload Video to Cloud</h3>
                <button onclick="closeUploadModal()" class="text-gray-400 hover:text-gray-600 font-bold text-lg">&times;</button>
            </div>
            <form id="uploadForm" onsubmit="handleCloudBucketUpload(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Video Title</label>
                    <input type="text" id="videoTitle" required placeholder="e.g. My Masterpiece" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-gold-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Category</label>
                    <select id="videoCategory" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-gold-500">
                        <option value="Cinematic">Cinematic</option>
                        <option value="Technology">Technology</option>
                        <option value="Vlogs">Vlogs</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Select Video File (.mp4)</label>
                    <input type="file" id="videoFile" accept="video/*" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none file:mr-4 file:py-1 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-gold-50 file:text-gold-600 hover:file:bg-gold-100 cursor-pointer">
                </div>
                <div class="pt-2 flex space-x-3">
                    <button type="button" onclick="closeUploadModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-2.5 rounded-xl text-sm font-semibold">Cancel</button>
                    <button type="submit" id="submitBtn" class="flex-1 bg-gold-500 hover:bg-gold-600 text-white py-2.5 rounded-xl text-sm font-semibold shadow-sm">Upload Video</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-6 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm text-gray-500">
            &copy; 2026 GoldenNest. Full-Scale Creator Network.
        </div>
    </footer>

    <!-- Full-Scale Application Script -->
    <script>
        const SUPABASE_URL = 'https://oemydtxwalfjmluzykmr.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_gK1skiPXPysYi9wOiFjQzg_0vYEmg3I';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let currentProfile = null;
        let allVideos = [];
        let currentCategory = 'All';
        let searchQuery = '';
        let isSignUpMode = false;

        async function initApp() {
            let { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                currentUser = session.user;
                await fetchProfile(currentUser.id);
            }
            updateAuthUI();
            fetchVideosFromCloud();
        }

        async function fetchProfile(userId) {
            let { data } = await _supabase.from('profiles').select('*').eq('id', userId).single();
            currentProfile = data;
        }

        function updateAuthUI() {
            let authNavArea = document.getElementById('authNavArea');
            let uploadNavBtn = document.getElementById('uploadNavBtn');

            if (currentUser && currentProfile) {
                uploadNavBtn.classList.remove('hidden');
                authNavArea.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span onclick="viewProfile('${currentProfile.username}')" class="text-sm font-semibold text-gold-600 cursor-pointer hover:underline">@${currentProfile.username}</span>
                        <button onclick="handleLogout()" class="text-xs bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-full text-gray-600 font-medium">Sign Out</button>
                    </div>
                `;
            } else {
                uploadNavBtn.classList.add('hidden');
                authNavArea.innerHTML = `
                    <button onclick="openAuthModal('login')" class="text-sm font-semibold text-gray-700 hover:text-gold-600 px-3 py-2">Sign In</button>
                    <button onclick="openAuthModal('signup')" class="bg-gold-500 hover:bg-gold-600 text-white px-4 py-2 rounded-full text-sm font-semibold shadow-sm transition-all">Sign Up</button>
                `;
            }
        }

        async function fetchVideosFromCloud() {
            try {
                let { data, error } = await _supabase
                    .from('videos')
                    .select('*, profiles(username)')
                    .order('created_at', { ascending: false });

                document.getElementById('loadingState').style.display = 'none';
                if (error) { console.error(error); return; }
                allVideos = data || [];
                renderFeed();
            } catch (err) {
                console.error(err);
            }
        }

        async function renderFeed() {
            let feed = document.getElementById('videoFeed');
            feed.innerHTML = '';

            let filtered = allVideos.filter(v => {
                let creatorName = v.profiles ? v.profiles.username : v.creator;
                let matchesCategory = (currentCategory === 'All' || v.category === currentCategory || creatorName === currentCategory);
                let matchesSearch = v.title.toLowerCase().includes(searchQuery.toLowerCase()) || creatorName.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                feed.innerHTML = `<div class="col-span-2 text-center py-12 text-gray-400">No videos found.</div>`;
                return;
            }

            for (let v of filtered) {
                let creatorName = v.profiles ? v.profiles.username : v.creator;
                let isOwner = currentUser && v.user_id === currentUser.id;

                let card = document.createElement('div');
                card.className = "bg-white border border-gray-200 rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition-all flex flex-col";
                card.innerHTML = `
                    <div class="aspect-video bg-black relative flex items-center justify-center">
                        <video src="${v.url}" controls preload="metadata" class="w-full h-full object-cover"></video>
                    </div>
                    <div class="p-4 space-y-3">
                        <div class="flex space-x-3 items-start">
                            <div onclick="viewProfile('${creatorName}')" class="w-10 h-10 rounded-full bg-gold-500 text-white flex items-center justify-center font-bold flex-shrink-0 cursor-pointer hover:bg-gold-600">
                                ${creatorName.charAt(0).toUpperCase()}
                            </div>
                            <div class="flex-1 min-w-0">
                                <h3 class="font-semibold text-gray-900 line-clamp-2 leading-snug">${v.title}</h3>
                                <p onclick="viewProfile('${creatorName}')" class="text-sm text-gold-600 font-medium mt-0.5 cursor-pointer hover:underline">@${creatorName}</p>
                            </div>
                        </div>

                        <div class="flex items-center justify-between text-xs text-gray-500 pt-2 border-t border-gray-100">
                            <div class="flex items-center space-x-3">
                                <button onclick="handleLike(${v.id}, ${v.likes || 0})" class="flex items-center space-x-1 px-2.5 py-1 rounded-full border bg-gray-50 border-gray-200 hover:bg-gray-100 transition-all">
                                    <span>❤️</span> <span class="font-semibold">${v.likes || 0}</span>
                                </button>
                                <button onclick="shareVideo('${v.url}', '${v.title}')" class="hover:text-gold-600">🔗 Share</button>
                            </div>
                            ${isOwner ? `<button onclick="deleteVideo(${v.id})" class="text-red-500 hover:underline">Delete</button>` : ''}
                        </div>

                        <!-- Comments Section -->
                        <div class="space-y-2 pt-2 border-t border-gray-100">
                            <div id="comments-${v.id}" class="space-y-1.5 max-h-32 overflow-y-auto text-xs"></div>
                            ${currentUser ? `
                                <form onsubmit="postComment(event, ${v.id})" class="flex space-x-2">
                                    <input type="text" id="comment-input-${v.id}" placeholder="Add a comment..." required class="flex-1 bg-gray-50 border border-gray-200 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-gold-500">
                                    <button type="submit" class="bg-gold-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold">Post</button>
                                </form>
                            ` : `<p class="text-xs text-gray-400 italic">Sign in to comment.</p>`}
                        </div>
                    </div>
                `;
                feed.appendChild(card);
                loadComments(v.id);
            }
        }

        async function loadComments(videoId) {
            let container = document.getElementById(`comments-${videoId}`);
            if (!container) return;

            let { data } = await _supabase.from('comments').select('*').eq('video_id', videoId).order('created_at', { ascending: true });
            container.innerHTML = '';

            if (data && data.length > 0) {
                data.forEach(c => {
                    let div = document.createElement('div');
                    div.className = "text-gray-700 bg-gray-50 px-2.5 py-1 rounded-lg";
                    div.innerHTML = `<span class="font-semibold text-gold-600">@${c.username}:</span> ${c.content}`;
                    container.appendChild(div);
                });
            } else {
                container.innerHTML = `<span class="text-gray-400">No comments yet.</span>`;
            }
        }

        async function postComment(event, videoId) {
            event.preventDefault();
            if (!currentUser || !currentProfile) return;

            let input = document.getElementById(`comment-input-${videoId}`);
            let content = input.value;

            await _supabase.from('comments').insert([{
                video_id: videoId,
                user_id: currentUser.id,
                username: currentProfile.username,
                content: content
            }]);

            input.value = '';
            loadComments(videoId);
        }

        async function viewProfile(username) {
            document.getElementById('feedHeader').style.display = 'none';
            let feed = document.getElementById('videoFeed');
            feed.innerHTML = `<div class="col-span-2 text-center py-12 text-gray-400">Loading profile @${username}...</div>`;

            let { data: profileData } = await _supabase.from('profiles').select('*').eq('username', username).single();
            if (!profileData) {
                feed.innerHTML = `<div class="col-span-2 text-center py-12 text-red-500">User profile not found.</div>`;
                return;
            }

            let { data: userVideos } = await _supabase.from('videos').select('*').eq('user_id', profileData.id);
            let { count: followerCount } = await _supabase.from('follows').select('*', { count: 'exact', head: true }).eq('following_username', username);
            
            let isFollowing = false;
            if (currentUser) {
                let { data: followCheck } = await _supabase.from('follows').select('*').eq('follower_id', currentUser.id).eq('following_username',
