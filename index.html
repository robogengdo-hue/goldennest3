<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoldenNest - Creator Media Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gold: { 500: '#D4AF37', 600: '#AA8C2C' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 font-sans antialiased min-h-screen flex flex-col">

    <!-- Top Navigation Bar -->
    <header class="sticky top-0 z-50 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div onclick="goHome()" class="flex items-center space-x-3 cursor-pointer">
                <div class="w-10 h-10 rounded-xl bg-gold-500 flex items-center justify-center text-white font-bold text-xl shadow-md">G</div>
                <span class="text-xl font-bold tracking-tight text-gray-900 dark:text-white">Golden<span class="text-gold-600">Nest</span></span>
            </div>

            <div class="hidden md:flex flex-1 max-w-md mx-8">
                <div class="relative w-full">
                    <input type="text" id="searchInput" oninput="searchVideos()" placeholder="Search videos or tags..." class="w-full bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-full py-2 pl-4 pr-10 text-sm text-gray-900 dark:text-gray-100 focus:outline-none focus:border-gold-500">
                    <span class="absolute right-3 top-2.5 text-gray-400">🔍</span>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <button onclick="showNotifications()" class="w-9 h-9 rounded-full bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 flex items-center justify-center text-gray-600 dark:text-gray-300 hover:bg-gray-200">🔔</button>
                <button onclick="toggleDarkMode()" class="w-9 h-9 rounded-full bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 flex items-center justify-center text-gray-600 dark:text-gray-300 hover:bg-gray-200"><span id="themeIcon">🌙</span></button>
                <button onclick="openUploadModal()" class="bg-gold-500 hover:bg-gold-600 text-white px-4 py-2 rounded-full text-sm font-semibold shadow-sm">+ Create</button>
                <div id="authNavArea" class="flex items-center space-x-3">
                    <button onclick="openAuthModal('login')" class="bg-gray-900 dark:bg-gray-100 text-white dark:text-gray-900 px-4 py-2 rounded-full text-sm font-semibold">Sign In</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Layout -->
    <main class="flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-1 lg:grid-cols-4 gap-8">
        <aside class="hidden lg:block lg:col-span-1 space-y-2">
            <a href="javascript:void(0)" onclick="goHome()" class="flex items-center space-x-3 px-4 py-3 rounded-xl bg-gold-50 dark:bg-gold-500/10 text-gold-600 font-semibold"><span>🏠</span> <span>Home Feed</span></a>
            <a href="javascript:void(0)" onclick="showReelsFeed()" class="flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-900 text-gray-600 dark:text-gray-300 font-medium"><span>⚡</span> <span>Reels</span></a>
            <a href="javascript:void(0)" onclick="filterByCategory('Trending')" class="flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-900 text-gray-600 dark:text-gray-300 font-medium"><span>🔥</span> <span>Trending</span></a>
            <a href="javascript:void(0)" onclick="showSavedVideos()" class="flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-900 text-gray-600 dark:text-gray-300 font-medium"><span>🔖</span> <span>Saved Posts</span></a>
            <a href="javascript:void(0)" onclick="showNotifications()" class="flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-900 text-gray-600 dark:text-gray-300 font-medium"><span>🔔</span> <span>Activity Feed</span></a>
        </aside>

        <section class="col-span-1 lg:col-span-3 space-y-6">
            <div id="feedHeader" class="flex items-center space-x-2 overflow-x-auto pb-2">
                <button onclick="filterByCategory('All')" class="bg-gray-900 dark:bg-gray-100 text-white dark:text-gray-900 px-4 py-1.5 rounded-full text-sm font-medium">All</button>
                <button onclick="showReelsFeed()" class="bg-gray-100 dark:bg-gray-900 text-gray-700 dark:text-gray-300 px-4 py-1.5 rounded-full text-sm font-medium">⚡ Reels</button>
                <button onclick="filterByCategory('Trending')" class="bg-gray-100 dark:bg-gray-900 text-gray-700 dark:text-gray-300 px-4 py-1.5 rounded-full text-sm font-medium">🔥 Trending</button>
            </div>

            <div id="dynamicContentArea" class="space-y-6">
                <div id="loadingState" class="text-center py-12 text-gray-400">Loading GoldenNest feed...</div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6" id="videoFeed"></div>
            </div>
        </section>
    </main>

    <!-- Auth Modal -->
    <div id="authModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div class="text-center pb-2 border-b border-gray-100 dark:border-gray-800">
                <div class="w-12 h-12 rounded-2xl bg-gold-500 mx-auto flex items-center justify-center text-white font-bold text-2xl shadow-md mb-2">G</div>
                <h3 id="authTitle" class="text-xl font-bold text-gray-900 dark:text-white">Welcome to GoldenNest</h3>
            </div>
            <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-3">
                <div id="usernameFieldGroup" class="hidden">
                    <label class="block text-xs font-semibold uppercase text-gray-700 dark:text-gray-300 mb-1">Username</label>
                    <input type="text" id="authUsername" placeholder="e.g. mr_psycho" class="w-full bg-gray-50 dark:bg-gray-800 border rounded-xl px-3 py-2 text-sm text-gray-900 dark:text-gray-100">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-700 dark:text-gray-300 mb-1">Email</label>
                    <input type="email" id="authEmail" required placeholder="name@example.com" class="w-full bg-gray-50 dark:bg-gray-800 border rounded-xl px-3 py-2 text-sm text-gray-900 dark:text-gray-100">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-700 dark:text-gray-300 mb-1">Password</label>
                    <input type="password" id="authPassword" required placeholder="••••••••" class="w-full bg-gray-50 dark:bg-gray-800 border rounded-xl px-3 py-2 text-sm text-gray-900 dark:text-gray-100">
                </div>
                <button type="submit" id="authSubmitBtn" class="w-full bg-gold-500 hover:bg-gold-600 text-white py-2.5 rounded-xl text-sm font-semibold">Sign In</button>
                
                <!-- Fixed Visible Toggle Button -->
                <div class="pt-2 text-center">
                    <button type="button" onclick="toggleAuthMode()" id="authToggleBtn" class="text-sm font-medium text-gold-600 hover:underline">Don't have an account? Sign Up</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Upload Modal -->
    <div id="uploadModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold">Upload Video</h3>
                <button onclick="closeUploadModal()" class="text-gray-400 font-bold text-lg">&times;</button>
            </div>
            <form id="uploadForm" onsubmit="handleCloudBucketUpload(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-700 dark:text-gray-300 mb-1">Title</label>
                    <input type="text" id="videoTitle" required class="w-full bg-gray-50 dark:bg-gray-800 border rounded-xl px-3 py-2 text-sm text-gray-900 dark:text-gray-100">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-700 dark:text-gray-300 mb-1">Description</label>
                    <textarea id="videoDescription" rows="2" class="w-full bg-gray-50 dark:bg-gray-800 border rounded-xl px-3 py-2 text-sm text-gray-900 dark:text-gray-100"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-700 dark:text-gray-300 mb-1">Category</label>
                        <select id="videoCategory" class="w-full bg-gray-50 dark:bg-gray-800 border rounded-xl px-3 py-2 text-sm text-gray-900 dark:text-gray-100">
                            <option value="Cinematic">Cinematic</option>
                            <option value="Technology">Technology</option>
                            <option value="Vlogs">Vlogs</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-700 dark:text-gray-300 mb-1">Format</label>
                        <select id="videoFormat" class="w-full bg-gray-50 dark:bg-gray-800 border rounded-xl px-3 py-2 text-sm text-gray-900 dark:text-gray-100">
                            <option value="horizontal">Standard (16:9)</option>
                            <option value="vertical">Reel (9:16)</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-700 dark:text-gray-300 mb-1">Video File</label>
                    <input type="file" id="videoFile" accept="video/*" required class="w-full text-sm text-gray-900 dark:text-gray-100">
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-gold-500 text-white py-2.5 rounded-xl text-sm font-semibold">Upload Video</button>
            </form>
        </div>
    </div>

    <!-- Script Engine -->
    <script>
        const SUPABASE_URL = 'https://oemydtxwalfjmluzykmr.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_gK1skiPXPysYi9wOiFjQzg_0vYEmg3I';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let currentProfile = null;
        let allVideos = [];
        let savedVideoIds = new Set();
        let currentCategory = 'All';
        let searchQuery = '';
        let isSignUpMode = false;

        function toggleDarkMode() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
                document.getElementById('themeIcon').innerText = '🌙';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
                document.getElementById('themeIcon').innerText = '☀️';
            }
        }

        async function initApp() {
            if (localStorage.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('themeIcon').innerText = '☀️';
            }
            
            let { data: { session } } = await _supabase.auth.getSession();
            if (session && session.user) {
                currentUser = session.user;
                let { data: profile } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).single();
                currentProfile = profile;
                
                let { data: saves } = await _supabase.from('saved_videos').select('video_id').eq('user_id', currentUser.id);
                savedVideoIds = new Set(saves ? saves.map(s => s.video_id) : []);

                updateAuthUI();
                fetchVideosFromCloud();
                document.getElementById('authModal').classList.add('hidden');
            } else {
                openAuthModal('login');
            }
        }

        function updateAuthUI() {
            let authNavArea = document.getElementById('authNavArea');
            if (currentUser && currentProfile) {
                authNavArea.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span onclick="viewProfile('${currentProfile.username}')" class="text-sm font-semibold text-gold-600 cursor-pointer hover:underline">@${currentProfile.username}</span>
                        <button onclick="handleLogout()" class="text-xs bg-gray-100 dark:bg-gray-800 px-3 py-1.5 rounded-full">Sign Out</button>
                    </div>
                `;
            }
        }

        async function fetchVideosFromCloud() {
            try {
                let { data, error } = await _supabase.from('videos').select('*, profiles(username, avatar_url)').order('created_at', { ascending: false });
                let loadingEl = document.getElementById('loadingState');
                if (loadingEl) loadingEl.style.display = 'none';
                if (error) { console.error(error); return; }
                allVideos = data || [];
                renderFeed();
            } catch (err) { console.error(err); }
        }

        function renderFeed() {
            let feed = document.getElementById('videoFeed');
            if (!feed) return;
            feed.innerHTML = '';
            
            let list = allVideos.filter(v => {
                let creatorName = v.profiles ? v.profiles.username : v.creator;
                let matchesCategory = currentCategory === 'All' || v.category === currentCategory || creatorName === currentCategory || (currentCategory === 'Trending' && (v.likes || 0) > 0);
                let query = searchQuery.toLowerCase();
                let matchesSearch = v.title.toLowerCase().includes(query) || creatorName.toLowerCase().includes(query);
                return matchesCategory && matchesSearch;
            });

            if (currentCategory === 'Trending') list.sort((a, b) => (b.likes || 0) - (a.likes || 0));

            if (list.length === 0) {
                feed.innerHTML = `<div class="col-span-2 text-center py-12 text-gray-400">No videos found.</div>`;
                return;
            }

            list.forEach(v => {
                let creatorName = v.profiles ? v.profiles.username : v.creator;
                let isOwner = currentUser && v.user_id === currentUser.id;
                let isSaved = savedVideoIds.has(v.id);

                let card = document.createElement('div');
                card.className = "bg-white dark:bg-gray-900 border rounded-2xl overflow-hidden shadow-sm flex flex-col";
                card.innerHTML = `
                    <div class="aspect-video bg-black"><video src="${v.url}" controls class="w-full h-full object-cover"></video></div>
                    <div class="p-4 space-y-3">
                        <h3 class="font-semibold">${v.title}</h3>
                        <p onclick="viewProfile('${creatorName}')" class="text-sm text-gold-600 cursor-pointer">@${creatorName}</p>
                        <div class="flex items-center justify-between text-xs pt-2 border-t">
                            <button onclick="handleLike(${v.id}, ${v.likes || 0})" class="px-2 py-1 border rounded">❤️ ${v.likes || 0}</button>
                            <button onclick="toggleSave(${v.id})" class="px-2 py-1 border rounded">${isSaved ? 'Saved' : 'Save'}</button>
                            ${isOwner ? `<button onclick="deleteVideo(${v.id})" class="text-red-500">Delete</button>` : ''}
                        </div>
                    </div>
                `;
                feed.appendChild(card);
            });
        }

        function showReelsFeed() {
            let container = document.getElementById('dynamicContentArea');
            if (!container) return;
            container.innerHTML = `<h2 class="text-xl font-bold mb-4">⚡ Reels</h2><div class="flex flex-col items-center space-y-8" id="reelsContainer"></div>`;
            let reelsContainer = document.getElementById('reelsContainer');
            let reelsList = allVideos.filter(v => v.format === 'vertical');
            if (reelsList.length === 0) reelsList = allVideos;

            reelsList.forEach(v => {
                let card = document.createElement('div');
                card.className = "relative bg-black rounded-3xl overflow-hidden shadow-2xl w-full max-w-sm aspect-[9/16] flex items-center justify-center border";
                card.innerHTML = `<video src="${v.url}" controls loop class="w-full h-full object-cover"></video>`;
                reelsContainer.appendChild(card);
            });
        }

        function filterByCategory(cat) { currentCategory = cat; renderFeed(); }
        function searchVideos() { searchQuery = document.getElementById('searchInput').value; renderFeed(); }
        function goHome() { 
            document.getElementById('feedHeader').style.display = 'flex'; 
            document.getElementById('dynamicContentArea').innerHTML = `
                <div id="loadingState" class="text-center py-12 text-gray-400" style="display:none;"></div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6" id="videoFeed"></div>
            `; 
            renderFeed(); 
        }
        
        function openAuthModal(mode) {
            isSignUpMode = (mode === 'signup');
            document.getElementById('authTitle').innerText = isSignUpMode ? "Join GoldenNest" : "Sign In";
            document.getElementById('authSubmitBtn').innerText = isSignUpMode ? "Create Account" : "Sign In";
            document.getElementById('authToggleBtn').innerText = isSignUpMode ? "Already have an account? Sign In" : "Don't have an account? Sign Up";
            document.getElementById('usernameFieldGroup').classList.toggle('hidden', !isSignUpMode);
            document.getElementById('authModal').classList.remove('hidden');
        }
        function closeAuthModal() { document.getElementById('authModal').classList.add('hidden'); }
        function toggleAuthMode() { openAuthModal(isSignUpMode ? 'login' : 'signup'); }

        function openUploadModal() {
            if (!currentUser) { alert("Please sign in first."); openAuthModal('login'); return; }
            document.getElementById('uploadModal').classList.remove('hidden');
        }
        function closeUploadModal() { document.getElementById('uploadModal').classList.add('hidden'); }

        async function handleAuthSubmit(event) {
            event.preventDefault();
            let email = document.getElementById('authEmail').value;
            let password = document.getElementById('authPassword').value;
            if (isSignUpMode) {
                let
