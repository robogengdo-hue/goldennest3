<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoldenNest - Creator Media Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: { 500: '#D4AF37', 600: '#AA8C2C' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex flex-col">

    <!-- Top Navigation Bar -->
    <header class="sticky top-0 z-50 bg-white border-b border-gray-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="filterByCategory('All')">
                <div class="w-10 h-10 rounded-xl bg-gold-500 flex items-center justify-center text-white font-bold text-xl shadow-md">G</div>
                <span class="text-xl font-bold tracking-tight text-gray-900">Golden<span class="text-gold-600">Nest</span></span>
            </div>

            <!-- Search Bar -->
            <div class="hidden md:flex flex-1 max-w-md mx-8">
                <div class="relative w-full">
                    <input type="text" id="searchInput" oninput="searchVideos()" placeholder="Search cloud videos or creators..." class="w-full bg-gray-100 border border-gray-200 rounded-full py-2 pl-4 pr-10 text-sm focus:outline-none focus:border-gold-500 focus:bg-white transition-all">
                    <span class="absolute right-3 top-2.5 text-gray-400">🔍</span>
                </div>
            </div>

            <div class="flex items-center space-x-4">
                <button onclick="openUploadModal()" class="bg-gold-500 hover:bg-gold-600 text-white px-4 py-2 rounded-full text-sm font-semibold shadow-sm transition-all">+ Create</button>
                <div class="w-9 h-9 rounded-full bg-gray-200 border border-gray-300 flex items-center justify-center font-bold text-gray-700">U</div>
            </div>
        </div>
    </header>

    <!-- Main Content Layout -->
    <main class="flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-1 lg:grid-cols-4 gap-8">
        <aside class="hidden lg:block lg:col-span-1 space-y-2">
            <a href="#" onclick="filterByCategory('All')" class="flex items-center space-x-3 px-4 py-3 rounded-xl bg-gold-50 text-gold-600 font-semibold"><span>🏠</span> <span>Home Feed</span></a>
            <a href="#" onclick="filterByCategory('Cinematic')" class="flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-gray-100 text-gray-600 font-medium"><span>🎬</span> <span>Cinematic</span></a>
            <a href="#" onclick="filterByCategory('Technology')" class="flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-gray-100 text-gray-600 font-medium"><span>💻</span> <span>Technology</span></a>
            <a href="#" onclick="filterByCategory('Vlogs')" class="flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-gray-100 text-gray-600 font-medium"><span>🎥</span> <span>Vlogs</span></a>
        </aside>

        <!-- Media Feed -->
        <section class="col-span-1 lg:col-span-3 space-y-6">
            <div class="flex items-center space-x-2 overflow-x-auto pb-2">
                <button onclick="filterByCategory('All')" class="category-btn bg-gray-900 text-white px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap">All</button>
                <button onclick="filterByCategory('Cinematic')" class="category-btn bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap transition-all">Cinematic</button>
                <button onclick="filterByCategory('Technology')" class="category-btn bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap transition-all">Technology</button>
                <button onclick="filterByCategory('Vlogs')" class="category-btn bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap transition-all">Vlogs</button>
            </div>

            <div id="loadingState" class="text-center py-12 text-gray-400">Loading permanent cloud videos...</div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6" id="videoFeed"></div>
        </section>
    </main>

    <!-- Upload Modal -->
    <div id="uploadModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                <h3 class="text-lg font-bold text-gray-900">Upload Video to Cloud</h3>
                <button onclick="closeUploadModal()" class="text-gray-400 hover:text-gray-600 font-bold text-lg">&times;</button>
            </div>
            <form id="uploadForm" onsubmit="handleCloudBucketUpload(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Video Title</label>
                    <input type="text" id="videoTitle" required placeholder="e.g. My Masterpiece" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-gold-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Creator Name / Handle</label>
                    <input type="text" id="creatorName" required placeholder="e.g. @mr_psycho" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-gold-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Category</label>
                    <select id="videoCategory" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-gold-500">
                        <option value="Cinematic">Cinematic</option>
                        <option value="Technology">Technology</option>
                        <option value="Vlogs">Vlogs</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Select Video File (.mp4)</label>
                    <input type="file" id="videoFile" accept="video/*" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none file:mr-4 file:py-1 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-gold-50 file:text-gold-600 hover:file:bg-gold-100 cursor-pointer">
                </div>
                <div class="pt-2 flex space-x-3">
                    <button type="button" onclick="closeUploadModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-2.5 rounded-xl text-sm font-semibold">Cancel</button>
                    <button type="submit" id="submitBtn" class="flex-1 bg-gold-500 hover:bg-gold-600 text-white py-2.5 rounded-xl text-sm font-semibold shadow-sm">Upload to Cloud</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-6 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm text-gray-500">
            &copy; 2026 GoldenNest. True Cloud Media Platform.
        </div>
    </footer>

    <!-- Full Cloud Integration Script -->
    <script>
        const SUPABASE_URL = 'https://oemydtxwalfjmluzykmr.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_gK1skiPXPysYi9wOiFjQzg_0vYEmg3I';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        let allVideos = [];
        let currentCategory = 'All';
        let searchQuery = '';

        async function fetchVideosFromCloud() {
            try {
                let { data, error } = await _supabase
                    .from('videos')
                    .select('*')
                    .order('created_at', { ascending: false });

                document.getElementById('loadingState').style.display = 'none';

                if (error) {
                    console.error('Error fetching:', error);
                    return;
                }

                allVideos = data || [];
                renderFeed();
            } catch (err) {
                console.error('Connection error:', err);
                document.getElementById('loadingState').innerText = "Could not load cloud feed.";
            }
        }

        function renderFeed() {
            let feed = document.getElementById('videoFeed');
            feed.innerHTML = '';

            let filtered = allVideos.filter(v => {
                let matchesCategory = (currentCategory === 'All' || v.category === currentCategory || v.creator === currentCategory);
                let matchesSearch = v.title.toLowerCase().includes(searchQuery.toLowerCase()) || v.creator.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                feed.innerHTML = `<div class="col-span-2 text-center py-12 text-gray-400">No videos found. Be the first to upload one!</div>`;
                return;
            }

            filtered.forEach(v => {
                let card = document.createElement('div');
                card.className = "bg-white border border-gray-200 rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition-all flex flex-col";
                card.innerHTML = `
                    <div class="aspect-video bg-black relative flex items-center justify-center">
                        <video src="${v.url}" controls preload="metadata" class="w-full h-full object-cover"></video>
                    </div>
                    <div class="p-4 flex space-x-3">
                        <div onclick="filterByCreator('${v.creator}')" class="w-10 h-10 rounded-full bg-gold-500 text-white flex items-center justify-center font-bold flex-shrink-0 cursor-pointer hover:bg-gold-600">
                            ${v.creator.charAt(1) ? v.creator.charAt(1).toUpperCase() : 'G'}
                        </div>
                        <div class="flex-1">
                            <h3 class="font-semibold text-gray-900 line-clamp-2 leading-snug">${v.title}</h3>
                            <p onclick="filterByCreator('${v.creator}')" class="text-sm text-gold-600 font-medium mt-1 cursor-pointer hover:underline">${v.creator}</p>
                            <div class="flex items-center justify-between text-xs text-gray-400 mt-2">
                                <span>1 view • Just now</span>
                                <div class="flex items-center space-x-2">
                                    <button onclick="handleLike(${v.id}, ${v.likes || 0})" class="flex items-center space-x-1 px-2.5 py-1 rounded-full border bg-gray-50 border-gray-200 text-gray-600 hover:bg-gray-100 transition-all">
                                        <span>🤍</span>
                                        <span class="font-semibold">${v.likes || 0}</span>
                                    </button>
                                    <button onclick="deleteVideo(${v.id})" class="text-gray-400 hover:text-red-500 px-2 py-1 text-xs" title="Delete video">🗑️</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                feed.appendChild(card);
            });
        }

        async function handleLike(id, currentLikes) {
            let newLikes = currentLikes + 1;
            let { error } = await _supabase
                .from('videos')
                .update({ likes: newLikes })
                .eq('id', id);

            if (!error) fetchVideosFromCloud();
        }

        async function deleteVideo(id) {
            if (!confirm("Are you sure you want to delete this video?")) return;
            let { error } = await _supabase.from('videos').delete().eq('id', id);
            if (!error) {
                fetchVideosFromCloud();
            } else {
                alert('Delete failed: ' + error.message);
            }
        }

        async function handleCloudBucketUpload(event) {
            event.preventDefault();
            let submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = "Uploading to Cloud Storage...";
            submitBtn.disabled = true;

            let fileInput = document.getElementById('videoFile');
            let file = fileInput.files[0];

            if (!file) {
                alert('Please select a video file.');
                submitBtn.innerText = "Upload to Cloud";
                submitBtn.disabled = false;
                return;
            }

            // 1. Upload file to Supabase Cloud Storage bucket
            let fileName = `${Date.now()}_${file.name}`;
            let { data: uploadData, error: uploadError } = await _supabase.storage
                .from('videos')
                .upload(fileName, file);

            if (uploadError) {
                alert('Storage upload failed: ' + uploadError.message);
                submitBtn.innerText = "Upload to Cloud";
                submitBtn.disabled = false;
                return;
            }

            // 2. Get permanent public URL for the video
            let { data: publicUrlData } = _supabase.storage
                .from('videos')
                .getPublicUrl(fileName);

            let permanentUrl = publicUrlData.publicUrl;

            // 3. Save video metadata to the Supabase database table
            let newVideo = {
                title: document.getElementById('videoTitle').value,
                creator: document.getElementById('creatorName').value,
                category: document.getElementById('videoCategory').value,
                url: permanentUrl,
                likes: 0
            };

            let { error: dbError } = await _supabase
                .from('videos')
                .insert([newVideo]);

            submitBtn.innerText = "Upload to Cloud";
            submitBtn.disabled = false;

            if (dbError) {
                alert('Database save failed: ' + dbError.message);
                return;
            }

            document.getElementById('uploadForm').reset();
            closeUploadModal();
            fetchVideosFromCloud();
        }

        function filterByCategory(cat) {
            currentCategory = cat;
            document.getElementById('searchInput').value = '';
            searchQuery = '';
            renderFeed();
        }

        function filterByCreator(creatorName) {
            currentCategory = creatorName;
            renderFeed();
        }

        function searchVideos() {
            searchQuery = document.getElementById('searchInput').value;
            renderFeed();
        }

        function openUploadModal() { document.getElementById('uploadModal').classList.remove('hidden'); }
        function closeUploadModal() { document.getElementById('uploadModal').classList.add('hidden'); }

        window.onload = fetchVideosFromCloud;
    </script>
</body>
</html>
