<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoldenNest - Creator Media Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gold: { 500: '#D4AF37', 600: '#AA8C2C' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 font-sans antialiased min-h-screen flex flex-col transition-colors duration-200">

    <!-- Top Navigation Bar -->
    <header class="sticky top-0 z-50 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 shadow-sm transition-colors duration-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="goHome()">
                <div class="w-10 h-10 rounded-xl bg-gold-500 flex items-center justify-center text-white font-bold text-xl shadow-md">G</div>
                <span class="text-xl font-bold tracking-tight text-gray-900 dark:text-white">Golden<span class="text-gold-600">Nest</span></span>
            </div>

            <!-- Search Bar -->
            <div class="hidden md:flex flex-1 max-w-md mx-8">
                <div class="relative w-full">
                    <input type="text" id="searchInput" oninput="searchVideos()" placeholder="Search videos, creators, or tags (#)..." class="w-full bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-full py-2 pl-4 pr-10 text-sm text-gray-900 dark:text-gray-100 focus:outline-none focus:border-gold-500 transition-all">
                    <span class="absolute right-3 top-2.5 text-gray-400">🔍</span>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <button onclick="showNotifications()" class="w-9 h-9 rounded-full bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 flex items-center justify-center text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-all" title="Notifications">
                    <span>🔔</span>
                </button>
                <button onclick="toggleDarkMode()" class="w-9 h-9 rounded-full bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 flex items-center justify-center text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-all" title="Toggle Theme">
                    <span id="themeIcon">🌙</span>
                </button>
                <button onclick="openUploadModal()" class="bg-gold-500 hover:bg-gold-600 text-white px-4 py-2 rounded-full text-sm font-semibold shadow-sm transition-all">+ Create</button>
                <div id="authNavArea" class="flex items-center space-x-3"></div>
            </div>
        </div>
    </header>

    <!-- Main Content Layout -->
    <main class="flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-1 lg:grid-cols-4 gap-8">
        <aside class="hidden lg:block lg:col-span-1 space-y-2">
            <a href="#" onclick="goHome()" class="flex items-center space-x-3 px-4 py-3 rounded-xl bg-gold-50 dark:bg-gold-500/10 text-gold-600 font-semibold"><span>🏠</span> <span>Home Feed</span></a>
            <a href="#" onclick="filterByCategory('Trending')" class="flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-900 text-gray-600 dark:text-gray-300 font-medium"><span>🔥</span> <span>Trending</span></a>
            <a href="#" onclick="showSavedVideos()" class="flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-900 text-gray-600 dark:text-gray-300 font-medium"><span>🔖</span> <span>Saved Posts</span></a>
            <a href="#" onclick="showNotifications()" class="flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-900 text-gray-600 dark:text-gray-300 font-medium"><span>🔔</span> <span>Activity Feed</span></a>
            <a href="#" onclick="filterByCategory('Cinematic')" class="flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-900 text-gray-600 dark:text-gray-300 font-medium"><span>🎬</span> <span>Cinematic</span></a>
            <a href="#" onclick="filterByCategory('Technology')" class="flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-900 text-gray-600 dark:text-gray-300 font-medium"><span>💻</span> <span>Technology</span></a>
            <a href="#" onclick="filterByCategory('Vlogs')" class="flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-900 text-gray-600 dark:text-gray-300 font-medium"><span>🎥</span> <span>Vlogs</span></a>
        </aside>

        <!-- Media Feed / Profile View -->
        <section class="col-span-1 lg:col-span-3 space-y-6">
            <div id="feedHeader" class="flex items-center space-x-2 overflow-x-auto pb-2">
                <button onclick="filterByCategory('All')" class="category-btn bg-gray-900 dark:bg-gray-100 text-white dark:text-gray-900 px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap">All</button>
                <button onclick="filterByCategory('Trending')" class="category-btn bg-gray-100 dark:bg-gray-900 hover:bg-gray-200 dark:hover:bg-gray-800 text-gray-700 dark:text-gray-300 px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap transition-all">🔥 Trending</button>
                <button onclick="filterByCategory('Cinematic')" class="category-btn bg-gray-100 dark:bg-gray-900 hover:bg-gray-200 dark:hover:bg-gray-800 text-gray-700 dark:text-gray-300 px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap transition-all">Cinematic</button>
                <button onclick="filterByCategory('Technology')" class="category-btn bg-gray-100 dark:bg-gray-900 hover:bg-gray-200 dark:hover:bg-gray-800 text-gray-700 dark:text-gray-300 px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap transition-all">Technology</button>
                <button onclick="filterByCategory('Vlogs')" class="category-btn bg-gray-100 dark:bg-gray-900 hover:bg-gray-200 dark:hover:bg-gray-800 text-gray-700 dark:text-gray-300 px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap transition-all">Vlogs</button>
            </div>

            <div id="dynamicContentArea" class="space-y-6">
                <div id="loadingState" class="text-center py-12 text-gray-400">Loading GoldenNest cloud platform...</div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6" id="videoFeed"></div>
            </div>
        </section>
    </main>

    <!-- Auth Modal -->
    <div id="authModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div class="text-center pb-2 border-b border-gray-100 dark:border-gray-800">
                <div class="w-12 h-12 rounded-2xl bg-gold-500 mx-auto flex items-center justify-center text-white font-bold text-2xl shadow-md mb-2">G</div>
                <h3 id="authTitle" class="text-xl font-bold text-gray-900 dark:text-white">Welcome to GoldenNest</h3>
                <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Sign in or create an account to enter the platform.</p>
            </div>
            <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-3">
                <div id="usernameFieldGroup" class="hidden">
                    <label class="block text-xs font-semibold uppercase text-gray-500 dark:text-gray-400 mb-1">Username / Handle</label>
                    <input type="text" id="authUsername" placeholder="e.g. mr_psycho" class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-3 py-2 text-sm text-gray-900 dark:text-gray-100 focus:outline-none focus:border-gold-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 dark:text-gray-400 mb-1">Email</label>
                    <input type="email" id="authEmail" required placeholder="name@example.com" class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-3 py-2 text-sm text-gray-900 dark:text-gray-100 focus:outline-none focus:border-gold-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 dark:text-gray-400 mb-1">Password</label>
                    <input type="password" id="authPassword" required placeholder="••••••••" class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-3 py-2 text-sm text-gray-900 dark:text-gray-100 focus:outline-none focus:border-gold-500">
                </div>
                <div class="pt-2 flex flex-col space-y-2">
                    <button type="submit" id="authSubmitBtn" class="w-full bg-gold-500 hover:bg-gold-600 text-white py-2.5 rounded-xl text-sm font-semibold shadow-sm">Sign In</button>
                    <button type="button" onclick="toggleAuthMode()" id="authToggleBtn" class="text-xs text-gold-600 hover:underline text-center">Don't have an account? Sign Up</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Upload Modal -->
    <div id="uploadModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-gray-100 dark:border-gray-800 pb-3">
                <h3 class="text-lg font-bold text-gray-900 dark:text-white">Upload Video to Cloud</h3>
                <button onclick="closeUploadModal()" class="text-gray-400 hover:text-gray-200 font-bold text-lg">&times;</button>
            </div>
            <form id="uploadForm" onsubmit="handleCloudBucketUpload(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 dark:text-gray-400 mb-1">Video Title</label>
                    <input type="text" id="videoTitle" required placeholder="e.g. My Masterpiece" class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-3 py-2 text-sm text-gray-900 dark:text-gray-100 focus:outline-none focus:border-gold-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 dark:text-gray-400 mb-1">Description & Hashtags</label>
                    <textarea id="videoDescription" rows="2" placeholder="Write details... use #tags like #cinematic" class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-3 py-2 text-sm text-gray-900 dark:text-gray-100 focus:outline-none focus:border-gold-500"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 dark:text-gray-400 mb-1">Category</label>
                    <select id="videoCategory" class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-3 py-2 text-sm text-gray-900 dark:text-gray-100 focus:outline-none focus:border-gold-500">
                        <option value="Cinematic">Cinematic</option>
                        <option value="Technology">Technology</option>
                        <option value="Vlogs">Vlogs</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 dark:text-gray-400 mb-1">Select Video File (.mp4)</label>
                    <input type="file" id="videoFile" accept="video/*" required class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-3 py-2 text-sm text-gray-900 dark:text-gray-100 focus:outline-none file:mr-4 file:py-1 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-gold-50 file:text-gold-600 hover:file:bg-gold-100 cursor-pointer">
                </div>
                <div class="pt-2 flex space-x-3">
                    <button type="button" onclick="closeUploadModal()" class="flex-1 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 py-2.5 rounded-xl text-sm font-semibold">Cancel</button>
                    <button type="submit" id="submitBtn" class="flex-1 bg-gold-500 hover:bg-gold-600 text-white py-2.5 rounded-xl text-sm font-semibold shadow-sm">Upload Video</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-800 py-6 mt-auto transition-colors duration-200">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm text-gray-500 dark:text-gray-400">
            &copy; 2026 GoldenNest. Full-Scale Creator Network.
        </div>
    </footer>

    <!-- Complete App Script -->
    <script>
        const SUPABASE_URL = 'https://oemydtxwalfjmluzykmr.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_gK1skiPXPysYi9wOiFjQzg_0vYEmg3I';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let currentProfile = null;
        let allVideos = [];
        let savedVideoIds = new Set();
        let currentCategory = 'All';
        let searchQuery = '';
        let isSignUpMode = false;

        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.getElementById('themeIcon').innerText = '☀️';
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('themeIcon').innerText = '🌙';
            }
        }

        function toggleDarkMode() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
                document.getElementById('themeIcon').innerText = '🌙';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
                document.getElementById('themeIcon').innerText = '☀️';
            }
        }

        async function initApp() {
            initTheme();
            let { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                currentUser = session.user;
                await fetchProfile(currentUser.id);
                await fetchSavedVideosList();
                updateAuthUI();
                fetchVideosFromCloud();
            } else {
                openAuthModal('login', true);
            }
        }

        async function fetchProfile(userId) {
            let { data } = await _supabase.from('profiles').select('*').eq('id', userId).single();
            currentProfile = data;
        }

        async function fetchSavedVideosList() {
            if (!currentUser) return;
            let { data } = await _supabase.from('saved_videos').select('video_id').eq('user_id', currentUser.id);
            savedVideoIds = new Set(data ? data.map(s => s.video_id) : []);
        }

        function updateAuthUI() {
            let authNavArea = document.getElementById('authNavArea');
            if (currentUser && currentProfile) {
                authNavArea.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span onclick="viewProfile('${currentProfile.username}')" class="text-sm font-semibold text-gold-600 cursor-pointer hover:underline">@${currentProfile.username}</span>
                        <button onclick="handleLogout()" class="text-xs bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 px-3 py-1.5 rounded-full text-gray-600 dark:text-gray-300 font-medium">Sign Out</button>
                    </div>
                `;
            }
        }

        async function fetchVideosFromCloud() {
            try {
                let { data, error } = await _supabase
                    .from('videos')
                    .select('*, profiles(username, avatar_url)')
                    .order('created_at', { ascending: false });

                document.getElementById('loadingState').style.display = 'none';
                if (error) { console.error(error); return; }
                allVideos = data || [];
                renderFeed();
            } catch (err) {
                console.error(err);
            }
        }

        async function renderFeed(videosToRender = null) {
            let feed = document.getElementById('videoFeed');
            feed.innerHTML = '';

            let list = videosToRender || allVideos;

            if (!videosToRender) {
                list = allVideos.filter(v => {
                    let creatorName = v.profiles ? v.profiles.username : v.creator;
                    let matchesCategory = true;
                    if (currentCategory === 'Trending') {
                        // sorted by likes
                    } else if (currentCategory !== 'All') {
                        matchesCategory = (v.category === currentCategory || creatorName === currentCategory);
                    }
                    let query = searchQuery.toLowerCase();
                    let matchesSearch = v.title.toLowerCase().includes(query) || 
                                        creatorName.toLowerCase().includes(query) || 
                                        (v.description && v.description.toLowerCase().includes(query));
                    return matchesCategory && matchesSearch;
                });

                if (currentCategory === 'Trending') {
                    list.sort((a, b) => (b.likes || 0) - (a.likes || 0));
                }
            }

            if (list.length === 0) {
                feed.innerHTML = `<div class="col-span-2 text-center py-12 text-gray-400">No videos found.</div>`;
                return;
            }

            for (let v of list) {
                let creatorName = v.profiles ? v.profiles.username : v.creator;
                let isOwner = currentUser && v.user_id === currentUser.id;
                let isSaved = savedVideoIds.has(v.id);

                let card = document.createElement('div');
                card.className = "bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition-all flex flex-col";
                card.innerHTML = `
                    <div class="aspect-video bg-black relative flex items-center justify-center">
                        <video src="${v.url}" controls preload="metadata" onplay="incrementViews(${v.id}, ${v.views || 1})" class="w-full h-full object-cover"></video>
                    </div>
                    <div class="p-4 space-y-3">
                        <div class="flex space-x-3 items-start">
                            <div onclick="viewProfile('${creatorName}')" class="w-10 h-10 rounded-full bg-gold-500 text-white flex items-center justify-center font-bold flex-shrink-0 cursor-pointer hover:bg-gold-600 overflow-hidden">
                                ${v.profiles && v.profiles.avatar_url ? `<img src="${v.profiles.avatar_url}" class="w-full h-full object-cover">` : creatorName.charAt(0).toUpperCase()}
                            </div>
                            <div class="flex-1 min-w-0">
                                <h3 class="font-semibold text-gray-900 dark:text-white line-clamp-2 leading-snug">${v.title}</h3>
                                <p onclick="viewProfile('${creatorName}')" class="text-sm text-gold-600 font-medium mt-0.5 cursor-pointer hover:underline">@${creatorName}</p>
                            </div>
                        </div>

                        ${v.description ? `<p class="text-xs text-gray-600 dark:text-gray-300 line-clamp-3">${v.description}</p>` : ''}

                        <div class="flex items-center justify-between text-xs text-gray-500 dark:text-gray-400 pt-2 border-t border-gray-100 dark:border-gray-800">
                            <div class="flex items-center space-x-3">
                                <span class="text-gray-400">${v.views || 1} views</span>
                                <button onclick="handleLike(${v.id}, ${v.likes || 0}, '${v.user_id}')" class="flex items-center space-x-1 px-2.5 py-1 rounded-full border bg-gray-50 dark:bg-gray-800 border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 transition-all">
                                    <span>❤️</span> <span class="font-semibold">${v.likes || 0}</span>
                                </button>
                                <button onclick="toggleSave(${v.id})" class="px-2.5 py-1 rounded-full border ${isSaved ? 'bg-gold-50 dark:bg-gold-500/10 border-gold-500 text-gold-600' : 'bg-gray-50 dark:bg-gray-800 border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300'} hover:bg-gray-100 transition-all">
                                    ${isSaved ? '🔖 Saved' : '🔖 Save'}
                                </button>
                                <button onclick="shareVideo('${v.url}', '${v.title}')" class="hover:text-gold-600">🔗 Share</button>
                            </div>
                            ${isOwner ? `<button onclick="deleteVideo(${v.id})" class="text-red-500 hover:underline">Delete</button>` : ''}
                        </div>

                        <!-- Comments Section -->
                        <div class="space-y-2 pt-2 border-t border-gray-100 dark:border-gray-800">
                            <div id="comments-${v.id}" class="space-y-1.5 max-h-32 overflow-y-auto text-xs"></div>
                            <form onsubmit="postComment(event, ${v.id}, '${v.user_id}')" class="flex space-x-2">
                                <input type="text" id="comment-input-${v.id}" placeholder="Add a comment..." required class="flex-1 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg px-3 py-1.5 text-xs text-gray-900 dark:text-gray-100 focus:outline-none focus:border-gold-500">
                                <button type="submit" class="bg-gold-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold">Post</button>
                            </form>
                        </div>
                    </div>
                `;
                feed.appendChild(card);
                loadComments(v.id);
            }
        }

        async function incrementViews(id, currentViews) {
            await _supabase.from('videos').update({ views: currentViews + 1 }).eq('id', id);
        }

        async function toggleSave(videoId) {
            if (!currentUser) return;
            if (savedVideoIds.has(videoId)) {
                await _supabase.from('saved_videos').delete().eq('user_id', currentUser.id).eq('video_id', videoId);
                savedVideoIds.delete(videoId);
            } else {
                await _supabase.from('saved_videos').insert([{ user_id: currentUser.id, video_id: videoId }]);
                savedVideoIds.add(videoId);
            }
            renderFeed();
        }

        async function showSavedVideos() {
            document.getElementById('feedHeader').style.display = 'none';
            let feed = document.getElementById('videoFeed');
            feed.innerHTML = `<div class="col-span-2 text-center py-12 text-gray-400">Loading saved posts...</div>`;

            let { data } = await _supabase.from('saved_videos').select('video_id, videos(*, profiles(username, avatar_url))').eq('user_id', currentUser.id);
            
            let savedList = data ? data.map(s => s.videos).filter(v => v !== null) : [];
            document.getElementById('dynamicContentArea').innerHTML = `
                <h2 class="text-xl font-bold text-gray-900 dark:text-white mb-4">🔖 Your Saved Posts</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6" id="videoFeed"></div>
            `;
            renderFeed(savedList);
        }

        async function showNotifications() {
            document.getElementById('feedHeader').style.display = 'none';
            let container = document.getElementById('dynamicContentArea');
            container.innerHTML = `<div class="text-center py-12 text-gray-400">Loading activity feed...</div>`;

            let { data } = await _supabase.from('notifications').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });

            container.innerHTML = `
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xl font-bold text-gray-900 dark:text-white">🔔 Activity Feed</h2>
                    ${data && data.length > 0 ? `<button onclick="clearNotifications()" class="text-xs text-red-500 hover:underline">Clear All</button>` : ''}
                </div>
                <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl p-4 shadow-sm space-y-3" id="notifList"></div>
            `;

            let list = document.getElementById('notifList');
            if (!data || data.length === 0) {
                list.innerHTML = `<p class="text-center py-8 text-gray-400 text-sm">No new notifications.</p>`;
                return;
            }

            data.forEach(n => {
                let div = document.createElement('div');
                div.className = "flex items-center justify-between p-3 rounded-xl bg-gray-50 dark:bg-gray-800 text-sm";
                div.innerHTML = `
                    <div>
                        <span class="font-semibold text-gold-600">@${n.actor_username}</span> <span class="text-gray-700 dark:text-gray-300">${n.action_text}</span>
                    </div>
                    <span class="text-xs text-gray-400">${new Date(n.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                `;
                list.appendChild(div);
            });
        }

        async function clearNotifications() {
            await _supabase.from('notifications').delete().eq('user_id', currentUser.id);
            showNotifications();
        }

        async function loadComments(videoId) {
            let container = document.getElementById(`comments-${videoId}`);
            if (!container) return;

            let { data } = await _supabase.from('comments').select('*').eq('video_id', videoId).order('created_at', { ascending: true });
            container.innerHTML = '';

            if (data && data.length > 0) {
                data.forEach(c => {
                    let div = document.createElement('div');
                    div.className = "text-gray-700 dark:text-gray-300 bg-gray-50 dark:bg-gray-800 px-2.5 py-1 rounded-lg";
                    div.innerHTML = `<span class="font-semibold text-gold-600">@${c.username}:</span> ${c.content}`;
                    container.appendChild(div);
                });
            } else {
                container.innerHTML = `<span class="text-gray-400">No comments yet.</span>`;
            }
        }

        async function postComment(event, videoId, ownerUserId) {
            event.preventDefault();
            let input = document.getElementById(`comment-input-${videoId}`);
            let content = input.value;

            await _supabase.from('comments').insert([{
                video_id: videoId,
                user_id: currentUser.id,
                username: currentProfile.username,
                content: content
            }]);

            if (ownerUserId && ownerUserId !== currentUser.id) {
                await _supabase.from('notifications').insert([{
                    user_id: ownerUserId,
                    actor_username: currentProfile.username,
                    action_text: `commented on your video: "${content}"`
                }]);
            }

            input.value = '';
            loadComments(videoId);
        }

        async function viewProfile(username) {
            document.getElementById('feedHeader').style.display = 'none';
            let feed = document.getElementById('videoFeed');
            feed.innerHTML = `<div class="col-span-2 text-center py-12 text-gray-400">Loading profile @${username}...</div>`;

            let { data: profileData } = await _supabase.from('profiles').select('*').eq('username', username).single();
            if (!profileData) {
                feed.innerHTML = `<div class="col-span-2 text-center py-12 text-red-500">User profile not found.</div>`;
                return;
            }

            let { data: userVideos } = await _supabase.from('videos').select('*').eq('user_id', profileData.id);
            let { count: followerCount } = await _supabase.from('follows').select('*', { count: 'exact', head: true }).eq('following_username', username);
            
            let isFollowing = false;
            let { data: followCheck } = await _supabase.from('follows').select('*').eq('follower_id', currentUser.id).eq('following_username', username).single();
            if (followCheck) isFollowing = true;

            let isOwnProfile = (currentUser.id === profileData.id);

            let container = document.getElementById('dynamicContentArea');
            container.innerHTML = `
                <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl p-6 shadow-sm space-y-4 mb-6">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-4">
                            <div class="w-16 h-16 rounded-full bg-gold-500 text-white flex items-center justify-center text-2xl font-bold overflow-hidden">
                                ${profileData.avatar_url ? `<img src="${profileData.avatar_url}" class="w-full h-full object-cover">` : username.charAt(0).toUpperCase()}
                            </div>
                            <div>
                                <h2 class="text-xl font-bold text-gray-900 dark:text-white">@${username}</h2>
                                <p class="text-sm text-gray-500 dark:text-gray-400 mt-0.5">${followerCount || 0} Followers • ${userVideos ? userVideos.length : 0} Videos</p>
                            </div>
                        </div>
                        ${!isOwnProfile ? `
                            <button onclick="toggleFollow('${username}', '${profileData.id}')" class="px-5 py-2 rounded-full text-sm font-semibold ${isFollowing ? 'bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300' : 'bg-gold-500 text-white hover:bg-gold-600'}">
                                ${isFollowing ? 'Following' : 'Follow'}
                            </button>
                        ` : ''}
                    </div>
                    <p class="text-sm text-gray-700 dark:text-gray-300">${profileData.bio || 'No bio added yet.'}</p>
                    ${profileData.social_link ? `<a href="${profileData.social_link}" target="_blank" class="text-xs text-gold-600 hover:underline block">🌐 ${profileData.social_link}</a>` : ''}
                    
                    ${isOwnProfile ? `
                        <div class="pt-3 border-t border-gray-100 dark:border-gray-800 space-y-2">
                            <div class="flex items-center space-x-3">
                                <input type="text" id="editBio" placeholder="Update your bio..." value="${profileData.bio || ''}" class="flex-1 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-3 py-2 text-sm text-gray-900 dark:text-gray-100 focus:outline-none focus:border-gold-500">
                                <input type="text" id="editAvatar" placeholder="Avatar Image URL" value="${profileData.avatar_url || ''}" class="flex-1 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-3 py-2 text-sm text-gray-900 dark:text-gray-100 focus:outline-none focus:border-gold-500">
                            </div>
                            <div class="flex items-center space-x-3">
                                <input type="url" id="editSocial" placeholder="Website / Portfolio URL" value="${profileData.social_link || ''}" class="flex-1 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-3 py-2 text-sm text-gray-900 dark:text-gray-100 focus:outline-none focus:border-gold-500">
                                <button onclick="updateProfileSettings()" class="bg-gold-500 hover:bg-gold-600 text-white px-6 py-2 rounded-xl text-sm font-semibold">Save Profile</button>
                            </div>
                        </div>
                    ` : ''}
                </div>
                <h3 class="font-bold text-lg text-gray-900 dark:text-white mb-4">Uploaded Videos</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6" id="profileVideoFeed"></div>
            `;

            let pFeed = document.getElementById('profileVideoFeed');
            if (!userVideos || userVideos.length === 0) {
                pFeed.innerHTML = `<div class="col-span-2 text-center py-8 text-gray-400">No videos uploaded yet.</div>`;
                return;
            }

            userVideos.forEach(v => {
                let card = document.createElement('div');
                card.className = "bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl overflow-hidden shadow-sm flex flex-col";
                card.innerHTML = `
                    <div class="aspect-video bg-black"><video src="${v.url}" controls class="w-full h-full object-cover"></video></div>
                    <div class="p-4"><h4 class="font-semibold text-gray-900 dark:text-white">${v.title}</h4></div>
                `;
                pFeed.appendChild(card);
            });
        }

        async function updateProfileSettings() {
            let newBio = document.getElementById('editBio').value;
            let newAvatar = document.getElementById('editAvatar').value;
            let newSocial = document.getElementById('editSocial').value;

            let { error } = await _supabase.from('profiles').update({ bio: newBio, avatar_url: newAvatar, social_link: newSocial }).eq('id', currentUser.id);
            if (error) {
                alert('Update failed: ' + error.message);
            } else {
                alert('Profile updated successfully!');
                await fetchProfile(currentUser.id);
                viewProfile(currentProfile.username);
            }
        }

        async function toggleFollow(followingUsername, profileId) {
            let { data: existing } = await _supabase.from('follows').select('*').eq('follower_id', currentUser.id).eq('following_username', followingUsername).single();
            if (existing) {
                await _supabase.from('follows').delete().eq('follower_id', currentUser.id).eq('following_username', followingUsername);
            } else {
                await _supabase.from('follows').insert([{ follower_id: currentUser.id, following_username: followingUsername }]);
                await _supabase.from('notifications').insert([{
                    user_id: profileId,
                    actor_username: currentProfile.username,
                    action_text: 'started following you.'
                }]);
            }
            viewProfile(followingUsername);
        }

        async function handleLike(id, currentLikes, ownerUserId) {
            await _supabase.from('videos').update({ likes: currentLikes + 1 }).eq('id', id);
            if (ownerUserId && ownerUserId !== currentUser.id) {
                await _supabase.from('notifications').insert([{
                    user_id: ownerUserId,
                    actor_username: currentProfile.username,
                    action_text: 'liked your video.'
                }]);
            }
            fetchVideosFromCloud();
        }

        async function deleteVideo(id) {
            if (!confirm("Delete this video?")) return;
            await _supabase.from('videos').delete().eq('id', id);
            fetchVideosFromCloud();
        }

        function shareVideo(url, title) {
            navigator.clipboard.writeText(url);
            alert(`Link copied to clipboard for: "${title}"`);
        }

        async function handleAuthSubmit(event) {
            event.preventDefault();
            let email = document.getElementById('authEmail').value;
            let password = document.getElementById('authPassword').value;
            let submitBtn = document.getElementById('authSubmitBtn');
            submitBtn.disabled = true;

            if (isSignUpMode) {
                let username = document.getElementById('authUsername').value;
                let { data, error } = await _supabase.auth.signUp({ email, password });
                if (error) { alert(error.message); submitBtn.disabled = false; return; }
                if (data.user) {
                    await _supabase.from('profiles').insert([{ id: data.user.id, username: username, bio: "Creator on GoldenNest" }]);
                }
                alert('Account created! Welcome to GoldenNest.');
            } else {
                let { error } = await _supabase.auth.signInWithPassword({ email, password });
                if (error) { alert(error.message); submitBtn.disabled = false; return; }
            }

            closeAuthModal();
            window.location.reload();
        }

        async function handleLogout() {
            await _supabase.auth.signOut();
            window.location.reload();
        }

        async function handleCloudBucketUpload(event) {
            event.preventDefault();
            let submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = "Uploading...";
            submitBtn.disabled = true;

            let file = document.getElementById('videoFile').files[0];
            let fileName = `${Date.now()}_${file.name}`;
            
            let { error: uploadError } = await _supabase.storage.from('videos').upload(fileName, file);
            if (uploadError) { alert(uploadError.message); submitBtn.disabled = false; return; }

            let { data: publicUrlData } = _supabase.storage.from('videos').getPublicUrl(fileName);

            await _supabase.from('videos').insert([{
                title: document.getElementById('videoTitle').value,
                description: document.getElementById('videoDescription').value,
                creator: currentProfile.username,
                user_id: currentUser.id,
                category: document.getElementById('videoCategory').value,
                url: publicUrlData.publicUrl,
                likes: 0,
                views: 1
            }]);

            closeUploadModal();
            document.getElementById('uploadForm').reset();
            submitBtn.innerText = "Upload Video";
            submitBtn.disabled = false;
            fetchVideosFromCloud();
        }

        function filterByCategory(cat) {
            currentCategory = cat;
            document.getElementById('searchInput').value = '';
            searchQuery = '';
            goHome();
            fetchVideosFromCloud();
        }

        function searchVideos() {
            searchQuery = document.getElementById('searchInput').value;
            renderFeed();
        }

        function goHome() {
            document.getElementById('feedHeader').style.display = 'flex';
            document.getElementById('dynamicContentArea').innerHTML = `
                <div id="loadingState" class="text-center py-12 text-gray-400">Loading feed...</div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6" id="videoFeed"></div>
            `;
            currentCategory = 'All';
            fetchVideosFromCloud();
        }

        function openAuthModal(mode, isMandatory = false) {
            isSignUpMode = (mode === 'signup');
            let modal = document.getElementById('authModal');
            document.getElementById('authTitle').innerText = isSignUpMode ? "Join GoldenNest" : "Sign In to GoldenNest";
            document.getElementById('authSubmitBtn').innerText = isSignUpMode ? "Create Account" : "Sign In";
            document.getElementById('authToggleBtn').innerText = isSignUpMode ? "Already have an account? Sign In" : "Don't have an account? Sign Up";
            document.getElementById('usernameFieldGroup').classList.toggle('hidden', !isSignUpMode);
            modal.classList.remove('hidden');
        }
        function closeAuthModal() { document.getElementById('authModal').classList.add('hidden'); }
        function toggleAuthMode() { openAuthModal(isSignUpMode ? 'login' : 'signup'); }

        function openUploadModal() { document.getElementById('uploadModal').classList.remove('hidden'); }
        function closeUploadModal() { document.getElementById('uploadModal').classList.add('hidden'); }

        window.onload = initApp;
    </script>
</body>
</html>
